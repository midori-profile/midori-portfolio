<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="rc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52514e"/></marker>
  </defs>
  <rect width="860" height="300" fill="#fcfcfb"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#0b0b0b">Two phases: build in memory, commit in one breath</text>

  <!-- render phase box -->
  <rect x="30" y="64" width="450" height="170" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#2a78d6">RENDER PHASE — interruptible</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="50" y="120">• performUnitOfWork, one fiber at a time</text>
    <text x="50" y="144">• builds the work-in-progress tree in memory</text>
    <text x="50" y="168">• yields whenever the browser needs the thread</text>
    <text x="50" y="192">• touches NOTHING on screen</text>
  </g>
  <text x="50" y="220" font-size="11" fill="#898781">can be paused, resumed, even thrown away</text>

  <!-- arrow -->
  <path d="M480,150 L560,150" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#rc)"/>
  <text x="520" y="138" font-size="11" fill="#52514e" text-anchor="middle">tree finished</text>

  <!-- commit phase box -->
  <rect x="566" y="64" width="264" height="170" rx="12" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5"/>
  <text x="586" y="92" font-size="14" font-weight="700" fill="#eb6834">COMMIT PHASE — atomic</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="586" y="120">• commitRoot walks the tree</text>
    <text x="586" y="144">• applies every DOM change</text>
    <text x="586" y="168">• synchronous, no yielding</text>
    <text x="586" y="192">• then runs the effects</text>
  </g>
  <text x="586" y="220" font-size="11" fill="#898781">the user never sees half a UI</text>

  <text x="30" y="272" font-size="12" fill="#52514e">This split is why Part I's "append as you go" had to die: an interruptible renderer that writes to the DOM mid-flight shows torn frames.</text>
</svg>
