<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="h1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6834"/></marker>
  </defs>
  <rect width="860" height="380" fill="#fcfcfb"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#0b0b0b">Hooks are just an array — the call order is the identity</text>

  <!-- component source -->
  <rect x="30" y="64" width="300" height="150" rx="10" fill="#0f1117"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#d7dae0">
    <text x="48" y="94">function Counter() {</text>
    <text x="62" y="118" fill="#7ee787">const [a] = useState(0)</text>
    <text x="62" y="142" fill="#79c0ff">const [b] = useState('hi')</text>
    <text x="62" y="166" fill="#e3b341">useEffect(fn, [a])</text>
    <text x="48" y="190">}</text>
  </g>

  <!-- fiber.hooks array render 1 -->
  <text x="420" y="84" font-size="13" font-weight="600" fill="#0b0b0b">render #1 — fiber.hooks</text>
  <g font-size="12" text-anchor="middle">
    <rect x="420" y="96" width="120" height="38" rx="6" fill="#eafaf3" stroke="#1baf7a"/>
    <text x="480" y="120" fill="#0b0b0b">[0] state: 0</text>
    <rect x="420" y="140" width="120" height="38" rx="6" fill="#eef4fc" stroke="#2a78d6"/>
    <text x="480" y="164" fill="#0b0b0b">[1] state: 'hi'</text>
    <rect x="420" y="184" width="120" height="38" rx="6" fill="#fdf6e7" stroke="#eda100"/>
    <text x="480" y="208" fill="#0b0b0b">[2] effect</text>
  </g>

  <!-- setState arrow -->
  <path d="M545,115 C610,115 610,115 660,113" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#h1)"/>
  <text x="602" y="100" font-size="11" fill="#eb6834" font-weight="600">setA(1) queued</text>

  <!-- fiber.hooks array render 2 -->
  <text x="668" y="84" font-size="13" font-weight="600" fill="#0b0b0b">render #2 — same slots</text>
  <g font-size="12" text-anchor="middle">
    <rect x="668" y="96" width="120" height="38" rx="6" fill="#eafaf3" stroke="#1baf7a" stroke-width="2"/>
    <text x="728" y="120" fill="#0b0b0b" font-weight="700">[0] state: 1</text>
    <rect x="668" y="140" width="120" height="38" rx="6" fill="#eef4fc" stroke="#2a78d6"/>
    <text x="728" y="164" fill="#0b0b0b">[1] state: 'hi'</text>
    <rect x="668" y="184" width="120" height="38" rx="6" fill="#fdf6e7" stroke="#eda100" stroke-width="2"/>
    <text x="728" y="208" fill="#0b0b0b" font-weight="700">[2] re-runs</text>
  </g>

  <!-- hookIndex pointer explanation -->
  <g font-size="12.5" fill="#52514e">
    <text x="30" y="262">Each useState / useEffect call reads slot hooks[hookIndex] from the PREVIOUS render (fiber.alternate), then hookIndex++.</text>
    <text x="30" y="286">Slot [0] matches slot [0] purely by position. That is the whole trick — and the reason hooks can't live inside an if:</text>
  </g>
  <rect x="30" y="302" width="800" height="44" rx="8" fill="#fdeeee"/>
  <text x="50" y="329" font-size="12.5" fill="#b02a2a" font-family="ui-monospace, Menlo, monospace">if (cond) useState(0)  // skips a slot → every later hook reads the WRONG previous state</text>
</svg>
